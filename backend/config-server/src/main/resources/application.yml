server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        # This server always runs with the "native" profile, serving config from the
        # classpath:/configurations directory bundled in the jar - there is no git-backed
        # config repo in this project. (A git backend is the more common production setup,
        # but would require an external repo this project doesn't have; native keeps the
        # demo self-contained while still exercising a real Config Server.)
        native:
          search-locations: classpath:/configurations

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.cloud: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
