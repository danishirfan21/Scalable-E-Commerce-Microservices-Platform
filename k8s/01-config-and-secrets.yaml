# Shared, non-sensitive configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  CONFIG_SERVER: config-server
  EUREKA_SERVER: eureka-server
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_USER: postgres

---
# PLACEHOLDER secret - these are the same demo values already committed in docker-compose.yml,
# not real production secrets. Replace before ever pointing this at a real cluster:
#   kubectl create secret generic ecommerce-secrets -n ecommerce \
#     --from-literal=DB_PASSWORD=<real-password> \
#     --from-literal=JWT_SECRET=<real-256-bit-secret>
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DB_PASSWORD: postgres
  JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
