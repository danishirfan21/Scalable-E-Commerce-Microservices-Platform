apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://eureka-server:8761/actuator/health; do sleep 3; done"]
      containers:
        - name: api-gateway
          image: ecommerce/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: ecommerce-config }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
  type: ClusterIP
---
# Ingress is the normal way to expose the gateway externally in a real cluster; NodePort here
# keeps the manifest usable against a plain kind/minikube cluster without an ingress controller.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
  namespace: ecommerce
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
  type: NodePort
