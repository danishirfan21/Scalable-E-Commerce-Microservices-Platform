apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://eureka-server:8761/actuator/health; do sleep 3; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 3; done"]
      containers:
        - name: product-service
          image: ecommerce/product-service:latest
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: ecommerce-config }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: DB_HOST, value: postgres-product }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: DB_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  selector: { app: product-service }
  ports: [{ port: 8082, targetPort: 8082 }]
