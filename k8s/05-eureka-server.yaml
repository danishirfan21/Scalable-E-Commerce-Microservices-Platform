apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server }
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://config-server:8888/actuator/health; do sleep 3; done"]
      containers:
        - name: eureka-server
          image: ecommerce/eureka-server:latest
          ports: [{ containerPort: 8761 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: EUREKA_HOSTNAME, value: eureka-server }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: ecommerce
spec:
  selector: { app: eureka-server }
  ports: [{ port: 8761, targetPort: 8761 }]
