name: E-Commerce Microservices CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_OPTS: -Xmx1024m

jobs:
  # Backend unit tests (mvn test - no Docker required, fast)
  backend-build:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [config-server, eureka-server, api-gateway, user-service, product-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn clean install -DskipTests -B

      - name: Run unit tests for ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          mvn test -B

      - name: Generate Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Report - ${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/*.xml
          reporter: java-junit
          # config-server/eureka-server/api-gateway genuinely have zero test files (they're thin
          # config/bootstrap services), so their surefire-reports dir is empty - that's expected,
          # not a failure.
          fail-on-empty: false

  # Integration tests with a real Docker daemon (Testcontainers: Postgres + embedded Kafka).
  # This is the job that actually proves the Kafka order-flow and concurrency behavior described
  # in the README - not just that the code compiles.
  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run product-service integration tests (Testcontainers Postgres + embedded Kafka)
        run: |
          cd backend/product-service
          mvn verify -B

      - name: Run order-service integration tests (Testcontainers Postgres + embedded Kafka)
        run: |
          cd backend/order-service
          mvn verify -B

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            backend/product-service/target/failsafe-reports
            backend/order-service/target/failsafe-reports

  # Code Quality Analysis - only runs when a SONAR_TOKEN secret is actually configured, so a
  # fork/clone without SonarCloud set up doesn't get a permanently-red pipeline over a step it
  # can't pass.
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: backend-build
    if: ${{ vars.SONAR_ORGANIZATION != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ecommerce-platform \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  # Frontend Build and Test
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Frontend
        # GitHub Actions sets CI=true, which makes CRA treat every ESLint *warning* as a build-
        # blocking error - including the 19 pre-existing `no-explicit-any` warnings already
        # accepted as a known baseline (see README/lint output: 0 errors, 19 warnings). The lint
        # step above already runs separately and would fail on any real error; CI=false here just
        # stops warnings from blocking the build, matching local/Codespaces build behavior.
        run: |
          cd frontend
          CI=false npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  # End-to-End Docker Verification - builds every image, boots the full stack, and runs
  # scripts/verify.sh against it: register/login, create a product, set stock, create an order,
  # poll until it reaches CONFIRMED, verify stock decreased, and check a rejection path.
  e2e-tests:
    name: End-to-End Docker Verification
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start the full stack
        run: docker compose up --build -d

      - name: Run end-to-end verification script
        run: bash scripts/verify.sh
        env:
          BASE_URL: http://localhost:8080

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: backend-build
    # Without this, the default GITHUB_TOKEN can't upload SARIF results to the Security tab -
    # the upload step fails with "Resource not accessible by integration".
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Trivy's fs scan resolves each pom.xml's dependency tree against Maven Central if it isn't
      # already in the local ~/.m2 cache. Without this, repeated CI runs from the shared GitHub
      # Actions runner IP pool get rate-limited by Maven Central mid-scan ("The repository blocks
      # all subsequent requests from this IP") - Trivy's own error message suggests this fix.
      - name: Warm Maven dependency cache for Trivy
        run: |
          for module in config-server eureka-server api-gateway user-service product-service order-service; do
            (cd backend/$module && mvn -B -q dependency:resolve) || true
          done

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker Build and Push - only on main, and only if a registry username is configured. Without
  # this guard, every push to main would fail here on missing DOCKER_USERNAME/DOCKER_PASSWORD
  # secrets in any fork or clone that hasn't set up a Docker Hub account.
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [integration-tests, frontend-build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DOCKER_USERNAME != ''

    strategy:
      matrix:
        service: [config-server, eureka-server, api-gateway, user-service, product-service, order-service, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/ecommerce-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || format('./backend/{0}', matrix.service) }}
          build-args: |
            ${{ matrix.service == 'frontend' && 'REACT_APP_API_URL=http://localhost:8080/api' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKER_USERNAME }}/ecommerce-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USERNAME }}/ecommerce-${{ matrix.service }}:buildcache,mode=max

  # Deploy to AWS ECS - disabled by default. This repo does not provision any AWS infrastructure
  # (no Terraform/CloudFormation - see docs/AWS_DEPLOYMENT.md, which is a deployment *guide*, not
  # IaC). Flip DEPLOY_AWS_ENABLED to 'true' as a repo variable only after you have actually
  # created the ECS cluster/services this job assumes exist.
  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_AWS_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS services
        run: |
          services=(config-server eureka-server api-gateway user-service product-service order-service frontend)
          for service in "${services[@]}"; do
            aws ecs update-service \
              --cluster ecommerce-cluster \
              --service $service \
              --force-new-deployment
          done

      - name: Wait for deployment
        run: |
          services=(config-server eureka-server api-gateway user-service product-service order-service frontend)
          for service in "${services[@]}"; do
            aws ecs wait services-stable \
              --cluster ecommerce-cluster \
              --services $service
          done

  # Notification - only meaningful once deploy-aws is actually enabled; skipped otherwise.
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-aws]
    if: always() && vars.DEPLOY_AWS_ENABLED == 'true'

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
